name: CI
on:
  push:
    branches: ["**"]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cooperative-savings-system/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: mvn -B -ntp verify 2>&1 | tee build.log; test ${PIPESTATUS[0]} -eq 0
        shell: bash
      - name: Report failures
        if: failure()
        run: python3 ../../.github/scripts/report_failures.py build.log
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: cooperative-savings-system/backend/target/surefire-reports
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cooperative-savings-system/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cooperative-savings-system/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc -p tsconfig.app.json --noEmit
      - run: npx vitest run
      - run: npm run build
