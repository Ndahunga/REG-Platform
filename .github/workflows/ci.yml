name: CI
on:
  push:
    branches: ["**"]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cooperative-savings-system/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: mvn -B -ntp verify 2>&1 | tee build.log; test ${PIPESTATUS[0]} -eq 0
        shell: bash
      - name: Report failures
        if: failure()
        run: python3 ../../.github/scripts/report_failures.py build.log
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: cooperative-savings-system/backend/target/surefire-reports
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cooperative-savings-system/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cooperative-savings-system/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc -p tsconfig.app.json --noEmit
      - run: npx vitest run
      - run: npm run build
  staging-seed:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: csams
          POSTGRES_USER: csams
          POSTGRES_PASSWORD: csams
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U csams" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build backend
        working-directory: cooperative-savings-system/backend
        run: mvn -B -ntp -q -DskipTests package
      - name: Start backend and seed
        shell: bash
        env:
          SPRING_PROFILES_ACTIVE: staging
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_DB: csams
          POSTGRES_USER: csams
          POSTGRES_PASSWORD: csams
          APP_SEED_DEFAULT_ADMIN: "true"
          SEED_STRICT: "1"
        run: |
          pip install openpyxl >/dev/null
          java -jar cooperative-savings-system/backend/target/csams-backend-*.jar > app.log 2>&1 &
          export COMRADES_SEED_JSON="$(cat .github/fixtures/sample-scheme.json)"
          python3 cooperative-savings-system/staging/seed.py 2>&1 | tee seed.log; test ${PIPESTATUS[0]} -eq 0
      - name: Report seed failures
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          def esc(s): return s.replace('%','%25').replace('\r','').replace('\n','%0A')
          seed = open('seed.log').read()[-3500:] if __import__('os').path.exists('seed.log') else 'no seed log'
          print('::error title=Seed log::' + esc(seed))
          lines = [l for l in open('app.log', errors='replace') if 'ERROR' in l or 'Exception' in l or 'Caused by' in l]
          print('::error title=App errors::' + esc(''.join(lines[-40:])[-3500:]))
          PY
