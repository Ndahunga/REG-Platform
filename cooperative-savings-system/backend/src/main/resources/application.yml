spring:
  application:
    name: terimbere-csams
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE_MB:10}MB
      max-request-size: ${MAX_FILE_SIZE_MB:10}MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}
            required: ${MAIL_SMTP_STARTTLS_REQUIRED:true}
          connectiontimeout: ${MAIL_CONNECTION_TIMEOUT_MS:10000}
          timeout: ${MAIL_TIMEOUT_MS:10000}
          writetimeout: ${MAIL_WRITE_TIMEOUT_MS:10000}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,readiness,liveness
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:false}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

app:
  version: ${APP_VERSION:1.0.0-SNAPSHOT}
  seed:
    default-admin: ${APP_SEED_DEFAULT_ADMIN:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173},https://terimbere-csams.vercel.app,https://wealthcommunity.ousuite.com
  jwt:
    access-secret: ${JWT_ACCESS_SECRET:local-dev-access-secret-change-me-minimum-sixty-four-characters-long}
    refresh-secret: ${JWT_REFRESH_SECRET:local-dev-refresh-secret-change-me-minimum-sixty-four-characters-xx}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
    refresh-cookie-name: csams_refresh_token
    refresh-cookie-secure: ${JWT_COOKIE_SECURE:false}
    refresh-cookie-same-site: ${JWT_COOKIE_SAME_SITE:Lax}
  file-storage:
    type: ${FILE_STORAGE_TYPE:local}
    base-path: ${FILE_STORAGE_BASE_PATH:../uploads}
    max-size-mb: ${MAX_FILE_SIZE_MB:10}
  security:
    max-failed-login-attempts: 5
    lock-duration-minutes: 15
    auth-rate-limit-enabled: true
    auth-rate-limit-max: 20
    contact-rate-limit-max: 5
    # Peers whose X-Forwarded-For is believed (comma separated addresses or CIDRs). Empty = loopback and private
    # ranges, which is what Render proxies connect from. Any other client can never choose its own rate-limit IP.
    trusted-proxies: ${TRUSTED_PROXIES:}
  fines:
    auto-generate-enabled: ${APP_FINES_AUTO_GENERATE_ENABLED:true}
  payments:
    verification:
      # Secure default: a payment is verified and posted only on authoritative confirmation (an officer's cash
      # confirmation, an imported statement line, or a signed provider callback). Payments that were already verified
      # before this rule existed are flagged as legacy exceptions in the database (V39). Turning this off is an explicit,
      # visible decision, never an accident of a missing setting.
      require-trusted-confirmation: ${APP_PAYMENTS_REQUIRE_TRUSTED_CONFIRMATION:true}
    # Receipt wording specific to this deployment, ADDED to the built-in English and Kinyarwanda vocabulary (never replacing
    # it): comma-separated phrases meaning success, failure, pending, a neutral heading, or a list of past transactions. A
    # receipt reading is advisory only: success never verifies or posts a payment. Blank (the default) adds nothing.
    receipt-vocabulary:
      extra-success: ${APP_PAYMENTS_RECEIPTVOCABULARY_EXTRASUCCESS:}
      extra-failed: ${APP_PAYMENTS_RECEIPTVOCABULARY_EXTRAFAILED:}
      extra-pending: ${APP_PAYMENTS_RECEIPTVOCABULARY_EXTRAPENDING:}
      extra-neutral: ${APP_PAYMENTS_RECEIPTVOCABULARY_EXTRANEUTRAL:}
      extra-history-markers: ${APP_PAYMENTS_RECEIPTVOCABULARY_EXTRAHISTORYMARKERS:}
    # Signed provider callbacks. A blank secret disables the channel (the endpoint answers 503). No provider integration
    # ships with the application: this is a generic signed contract for a sender the operator configures.
    # Each request carries X-Timestamp (epoch seconds) and X-Signature = HMAC-SHA256(secret, timestamp + "." + raw body).
    # Requests older than the replay window, or further in the future than the skew allowance, are refused.
    provider-callback:
      replay-window-seconds: ${PAYMENT_CALLBACK_REPLAY_WINDOW_SECONDS:300}
      max-future-skew-seconds: ${PAYMENT_CALLBACK_MAX_FUTURE_SKEW_SECONDS:60}
      # In-process abuse limits (0 disables). The reverse proxy / gateway must still rate-limit this public endpoint.
      rate-per-address-per-minute: ${PAYMENT_CALLBACK_RATE_PER_ADDRESS_PER_MINUTE:60}
      rate-per-channel-per-minute: ${PAYMENT_CALLBACK_RATE_PER_CHANNEL_PER_MINUTE:600}
      secrets:
        MTN_MOMO: ${PAYMENT_CALLBACK_SECRET_MTN_MOMO:}
        AIRTEL_MONEY: ${PAYMENT_CALLBACK_SECRET_AIRTEL_MONEY:}
        BANK_TRANSFER: ${PAYMENT_CALLBACK_SECRET_BANK_TRANSFER:}
        OTHER: ${PAYMENT_CALLBACK_SECRET_OTHER:}
  # Receipt reading. Needs the Tesseract binary on the server (apt install tesseract-ocr); where it is missing the
  # application reports receipts as unreadable instead of pretending. PNG and JPEG images are read with Tesseract; PDFs are read by their own text layer (a scanned PDF falls back to its embedded JPEG), bounded in pages, text and time.
  ocr:
    max-bytes: ${APP_OCR_MAX_BYTES:8388608}
    timeout-seconds: ${APP_OCR_TIMEOUT_SECONDS:30}
    tesseract:
      path: ${APP_OCR_TESSERACT_PATH:tesseract}
      language: ${APP_OCR_TESSERACT_LANGUAGE:eng}
    auto-generate-cron: ${APP_FINES_AUTO_GENERATE_CRON:0 30 1 * * *}
  whatsapp:
    enabled: ${WHATSAPP_ENABLED:false}
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    api-version: ${WHATSAPP_API_VERSION:v21.0}
    template-name: ${WHATSAPP_TEMPLATE_NAME:}
    template-language: ${WHATSAPP_TEMPLATE_LANGUAGE:en}
  mail:
    enabled: ${MAIL_ENABLED:true}
    host: ${MAIL_HOST:}
    from: ${MAIL_FROM:}
  support:
    # Public contact form: always delivered here, never to an address supplied by the visitor.
    email-to: ${SUPPORT_EMAIL_TO:support@ozufy.com}
    # Verified sender for those messages; falls back to MAIL_FROM. SMTP itself is configured by MAIL_HOST/PORT/USERNAME/PASSWORD.
    email-from: ${SUPPORT_EMAIL_FROM:}
  subscription:
    currency: RWF
    timezone: Africa/Kigali
    trial-months: 4
    trial-warning-days: 14
    monthly-charge: 2000.0000
    annual-list-price: 24000.0000
    annual-charge: 18000.0000
    annual-discount-percent: 25
    payment:
      # Checkout retry eligibility (same plan/channel/payer). Not provider final status.
      # Expiry of this window does NOT mark a payment FAILED.
      pending-reuse-minutes: ${SUBSCRIPTION_PENDING_REUSE_MINUTES:15}
      # PENDING older than this are skipped by reconciliation sweeps (still PENDING until
      # callback/webhook, status poll, or a new checkout replaces them).
      pending-abandon-hours: ${SUBSCRIPTION_PENDING_ABANDON_HOURS:48}
      reconciliation:
        enabled: ${SUBSCRIPTION_RECONCILIATION_ENABLED:false}
        fixed-delay-ms: ${SUBSCRIPTION_RECONCILIATION_FIXED_DELAY_MS:300000}
        initial-delay-ms: ${SUBSCRIPTION_RECONCILIATION_INITIAL_DELAY_MS:60000}
        min-age-minutes: ${SUBSCRIPTION_RECONCILIATION_MIN_AGE_MINUTES:2}
        batch-size: ${SUBSCRIPTION_RECONCILIATION_BATCH_SIZE:50}
      mtn:
        enabled: ${MTN_MOMO_ENABLED:false}
        base-url: ${MTN_MOMO_BASE_URL:https://sandbox.momodeveloper.mtn.com}
        subscription-key: ${MTN_MOMO_SUBSCRIPTION_KEY:}
        api-user: ${MTN_MOMO_API_USER:}
        api-key: ${MTN_MOMO_API_KEY:}
        # Explicit: sandbox | mtnrwanda (etc). Never inferred from base-url.
        target-environment: ${MTN_MOMO_TARGET_ENVIRONMENT:sandbox}
        callback-url: ${MTN_MOMO_CALLBACK_URL:}
      flutterwave:
        enabled: ${FLUTTERWAVE_ENABLED:false}
        base-url: ${FLUTTERWAVE_BASE_URL:https://api.flutterwave.com/v3}
        # Explicit: test | live. Never inferred from secret-key contents.
        mode: ${FLUTTERWAVE_MODE:test}
        public-key: ${FLUTTERWAVE_PUBLIC_KEY:}
        secret-key: ${FLUTTERWAVE_SECRET_KEY:}
        secret-hash: ${FLUTTERWAVE_SECRET_HASH:}
        redirect-url: ${FLUTTERWAVE_REDIRECT_URL:}
        webhook-url: ${FLUTTERWAVE_WEBHOOK_URL:}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{requestId}] %-5level %logger{36} - %msg%n"
  level:
    root: INFO
    rw.terimbere.csams: INFO
    org.springframework.security: INFO
