# =============================================================================
# TERIMBERE CSAMS — production-oriented Compose EXAMPLE
# Copy ideas into your real deploy; do not commit real secrets.
# Usage sketch:
#   cp .env.example .env   # fill production values securely
#   docker compose -f docker-compose.prod.example.yml --env-file .env up -d --build
# Put a TLS-terminating reverse proxy in front of published ports (or use
# an external load balancer). Prefer managed PostgreSQL in many production setups.
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    # Do not publish 5432 to the public internet in production.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: production
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      FILE_STORAGE_TYPE: ${FILE_STORAGE_TYPE:-local}
      FILE_STORAGE_BASE_PATH: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health/readiness"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_APP_NAME: ${VITE_APP_NAME:-OuWealth Community}
        VITE_APP_ENV: production
        VITE_ENABLE_PWA: ${VITE_ENABLE_PWA:-false}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    # Publish only on a private network / behind the TLS proxy.
    ports:
      - "8088:80"

volumes:
  postgres_data:
  uploads_data:
